*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:flex;flex-direction:column}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

// ---------- parameter (semua asumsi ada di sini)
const P = { Hc: 2.5, a: 10.5, yb: 2.0, bermW: 3.0, xc: 13.0, bw: 4.0, bed: -0.5, X: 24, Z: 22, cell: 0.25,
  tw: 0.25, bIn: 1.0, hIn: 0.8, bt: 0.25, wallT: 0.2 };
P.xb0 = P.a + 2 * (P.Hc - P.yb); P.xb1 = P.xb0 + P.bermW; P.xt = P.xb1 + 2 * P.yb;
const hAt = x => { x = Math.abs(x); if (x <= P.a) return P.Hc; if (x <= P.xb0) return P.Hc - (x - P.a) / 2; if (x <= P.xb1) return P.yb; if (x <= P.xt) return P.yb - (x - P.xb1) / 2; return 0; };

// ---------- three dasar
const cv = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d141b); scene.fog = new THREE.Fog(0x0d141b, 90, 190);
const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
const ctl = new OrbitControls(cam, cv); ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI * 0.96;
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x3a3026, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-20, 40, -25); scene.add(sun);

const M = (c, o = {}) => new THREE.MeshLambertMaterial(Object.assign({ color: c, side: THREE.DoubleSide }, o));
const MATS = { earth: M(0xffffff, { vertexColors: true, flatShading: true }), pav: M(0x2a2f36), shoulder: M(0x7c838c), ditch: M(0x4aa3d6), talang: M(0xf08a3a), trans: M(0xd9c24a),
  siphon: M(0xe0533d), conc: M(0xb9bec4), wing: M(0xd7dbe0), culvert: M(0x9aa3ad), cross: M(0xd8b36a), water: M(0x2f7fe0, { transparent: true, opacity: 0.75 }), iron: M(0x4a525c), bore: M(0x0a0f14) };
const EDGE = new THREE.LineBasicMaterial({ color: 0x0a0f14, transparent: true, opacity: 0.45 });
let G = new THREE.Group(); scene.add(G); let xray = false; const labels = [];

function addMesh(geo, mat, edges = true) {

  if (edges) { const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), EDGE); G.add(l); }
  return m;
}
const box = (x0, x1, y0, y1, z0, z1, mat) => { if (x1 < x0) [x0, x1] = [x1, x0]; if (z1 < z0) [z0, z1] = [z1, z0];
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0); g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); return addMesh(g, mat); };

// profil (x,y) diekstrusi sepanjang z (dinding penahan mengikuti lereng)
function profileWall(pts, z0, z1, mat) {
  const s = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.abs(z1 - z0), bevelEnabled: false }); g.translate(0, 0, Math.min(z0, z1)); return addMesh(g, mat);
}
// dinding miring bebas (pelan 2D p0->p1, tebal t, tinggi atas linear)
function skewWall(p0, p1, t, yb, yt0, yt1, mat) {
  const dx = p1[0] - p0[0], dz = p1[1] - p0[1], L = Math.hypot(dx, dz), nx = -dz / L * t / 2, nz = dx / L * t / 2;
  const A = [p0[0] + nx, p0[1] + nz], B = [p0[0] - nx, p0[1] - nz], C = [p1[0] - nx, p1[1] - nz], D = [p1[0] + nx, p1[1] + nz];
  const V = [[A, yb], [B, yb], [C, yb], [D, yb], [A, yt0], [B, yt0], [C, yt1], [D, yt1]].map(([q, y]) => [q[0], y, q[1]]);
  const F = [[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]], pos = [];
  for (const f of F) for (const k of [0,1,2,0,2,3]) pos.push(...V[f[k]]);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); return addMesh(g, mat);
}
// kotak yang menelusuri jalur (z, y dasar) sepanjang z pada x = cx
function sweepBox(cx, w, h, path, mat) {
  const pos = [], ring = ([z, y]) => [[cx - w / 2, y, z], [cx + w / 2, y, z], [cx + w / 2, y + h, z], [cx - w / 2, y + h, z]];
  for (let i = 0; i < path.length - 1; i++) { const a = ring(path[i]), b = ring(path[i + 1]);
    for (let k = 0; k < 4; k++) { const k2 = (k + 1) % 4; for (const q of [a[k], a[k2], b[k2], a[k], b[k2], b[k]]) pos.push(...q); } }
  for (const [r, rev] of [[ring(path[0]), 0], [ring(path[path.length - 1]), 1]]) for (const k of [0, 1, 2, 0, 2, 3]) pos.push(...r[k]);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); return addMesh(g, mat);
}
function label(text, x, y, z, hue) { labels.push({ text, v: new THREE.Vector3(x, y, z), hue }); }

// ---------- tanah (heightfield kolom, dinding tegak di tepi galian)
function earth(cutFn) {
  const c = P.cell, nx = Math.round(2 * P.X / c), nz = Math.round(2 * P.Z / c), yBot = -2.5;
  const cutAt = (i, j) => (i < 0 || j < 0 || i >= nx || j >= nz) ? undefined : cutFn(-P.X + (i + .5) * c, -P.Z + (j + .5) * c, -P.X + i * c, -P.X + (i + 1) * c);
  const pos = [], col = [], clr = (r, g, b) => { for (let k = 0; k < 6; k++) col.push(r, g, b); };
  const quad = (p, q, r, s) => { for (const v of [p, q, r, p, r, s]) pos.push(...v); };
  const GR = [0.36, 0.55, 0.25], FL = [0.74, 0.58, 0.38], CU = [0.5, 0.38, 0.26], WL = [0.52, 0.4, 0.28];
  for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
    const x0 = -P.X + i * c, x1 = x0 + c, z0 = -P.Z + j * c, z1 = z0 + c, cut = cutAt(i, j);
    const hh = x => cut !== null && cut !== undefined ? cut : hAt(x), h0 = hh(x0), h1 = hh(x1);
    quad([x0, h0, z0], [x1, h1, z0], [x1, h1, z1], [x0, h0, z1]);
    const xm = (x0 + x1) / 2; clr(...(cut !== null && cut !== undefined ? CU : (hAt(xm) > 0.02 ? FL : GR)));
    const nb = [[i - 1, j, 'x0'], [i + 1, j, 'x1'], [i, j - 1, 'z0'], [i, j + 1, 'z1']];
    for (const [ni, nj, side] of nb) {
      const ncut = cutAt(ni, nj), mine = cut !== null && cut !== undefined, out = ncut === undefined, theirs = !out && ncut !== null;
      let wall = false, base;
      if (out) { wall = true; base = yBot; } else if (!mine && theirs) { wall = true; base = ncut; }
      if (!wall) continue;
      const hA = side === 'z1' || side === 'z0' ? [hh(x0), hh(x1)] : [hh(side === 'x0' ? x0 : x1), hh(side === 'x0' ? x0 : x1)];
      let P0, P1;
      if (side === 'x0') { P0 = [x0, z0]; P1 = [x0, z1]; } else if (side === 'x1') { P0 = [x1, z0]; P1 = [x1, z1]; }
      else if (side === 'z0') { P0 = [x0, z0]; P1 = [x1, z0]; } else { P0 = [x0, z1]; P1 = [x1, z1]; }
      quad([P0[0], base, P0[1]], [P1[0], base, P1[1]], [P1[0], hA[1], P1[1]], [P0[0], hA[0], P0[1]]); clr(...WL);
    }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, MATS.earth); m.userData.earth = true; G.add(m);
}

// jalan: lapis perkerasan, bahu, marka tengah
function road() {
  box(-9, 9, P.Hc, P.Hc + 0.05, -P.Z, P.Z, MATS.pav); box(-P.a, -9, P.Hc, P.Hc + 0.03, -P.Z, P.Z, MATS.shoulder); box(9, P.a, P.Hc, P.Hc + 0.03, -P.Z, P.Z, MATS.shoulder);
  box(-0.08, 0.08, P.Hc + 0.05, P.Hc + 0.06, -P.Z, P.Z, M(0xf2cf2e));
}
// ---------- saluran drainase: penampang (relatif terhadap bibir saluran y = 0 = muka berm), ditanam di dalam timbunan
const RING = {
  box: { o: [[-.5, -1], [.5, -1], [.5, 0], [-.5, 0]], i: [[-.25, -.75], [.25, -.75], [.25, 0], [-.25, 0]], w: [[-.25, -.75], [.25, -.75], [.25, -.35], [-.25, -.35]] },
  trap(b, H, zs, t = 0.15) {                   // trapesium berlapis beton; zs = H/V sisi miring
    const k = Math.sqrt(1 + zs * zs), ht = b / 2 + zs * H, i = [[-b / 2, -H], [b / 2, -H], [ht, 0], [-ht, 0]];
    const xo = y => b / 2 + zs * (y + H) + t * k;                       // garis luar sejajar garis dalam, jarak tegak lurus t
    const o = [[-xo(-H - t), -H - t], [xo(-H - t), -H - t], [xo(0), 0], [-xo(0), 0]], wd = 0.4;
    return { o, i, w: [[-b / 2, -H], [b / 2, -H], [b / 2 + zs * wd, -H + wd], [-b / 2 - zs * wd, -H + wd]], top: 2 * ht };
  }
};
const lerpRing = (A, B, t) => { const f = k => A[k].map((p, n) => [p[0] + (B[k][n][0] - p[0]) * t, p[1] + (B[k][n][1] - p[1]) * t]); return { o: f('o'), i: f('i'), w: f('w') }; };
// loft sepanjang z: rings A (di z0) -> B (di z1), dinding berongga + rim, serta air sebagai prisma
function loftChan(s, z0, z1, A, B, mat, water = true) {
  const N = A === B ? 1 : 10, xc = s * P.xc, y0 = P.yb, pos = [], wpos = [];
  const pt = (p, z) => [xc + s * p[0], y0 + p[1], z];
  const q = (arr, a, b, c, d) => { for (const v of [a, b, c, a, c, d]) arr.push(...v); };
  for (let n = 0; n < N; n++) {
    const ta = n / N, tb = (n + 1) / N, za = z0 + (z1 - z0) * ta, zb = z0 + (z1 - z0) * tb, Ra = lerpRing(A, B, ta), Rb = lerpRing(A, B, tb);
    for (const k of [0, 1, 3]) { const k2 = (k + 1) % 4;                                  // kulit luar & dalam (sisi atas dilewati)
      q(pos, pt(Ra.o[k], za), pt(Ra.o[k2], za), pt(Rb.o[k2], zb), pt(Rb.o[k], zb)); q(pos, pt(Ra.i[k], za), pt(Ra.i[k2], za), pt(Rb.i[k2], zb), pt(Rb.i[k], zb)); }
    q(pos, pt(Ra.o[3], za), pt(Ra.i[3], za), pt(Rb.i[3], zb), pt(Rb.o[3], zb)); q(pos, pt(Ra.o[2], za), pt(Ra.i[2], za), pt(Rb.i[2], zb), pt(Rb.o[2], zb));   // rim kiri / kanan
    for (const k of [0, 1, 2, 3]) { const k2 = (k + 1) % 4; q(wpos, pt(Ra.w[k], za), pt(Ra.w[k2], za), pt(Rb.w[k2], zb), pt(Rb.w[k], zb)); }
  }
  const mk = (arr, m, e) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); g.computeVertexNormals(); return addMesh(g, m, e); };
  mk(pos, mat, false); if (water) mk(wpos, MATS.water, false);
}
// segmen saluran: [{z0,z1,A,B,mat}] -> mesh + data galian tanah
let CH = [];
const chanSeg = (z0, z1, A, B, mat, water = true) => CH.push({ z0, z1, A, B, mat, water });
function drawChannels() { for (const s of [-1, 1]) for (const c of CH) loftChan(s, c.z0, c.z1, c.A, c.B, c.mat, c.water); }
function chanCut(x0, x1, zc) {                 // tinggi muka tanah di dasar galian saluran (null = tidak digali)
  const c = CH.find(c => zc >= c.z0 && zc < c.z1); if (!c) return null;
  const R = c.A === c.B ? c.A : lerpRing(c.A, c.B, (zc - c.z0) / (c.z1 - c.z0)), o = R.o, hb = o[1][0], ht = o[2][0], yb = o[0][1], yt = o[2][1];
  const lo = Math.min(Math.abs(x0), Math.abs(x1)), hi = Math.max(Math.abs(x0), Math.abs(x1));
  const d = (lo <= P.xc && hi >= P.xc) ? 0 : Math.min(Math.abs(lo - P.xc), Math.abs(hi - P.xc));
  if (d >= ht - 1e-6) return null;
  return P.yb + (d <= hb ? yb : yb + (yt - yb) * (d - hb) / (ht - hb));
}
// saluran irigasi terbuka (kedua sisi): dinding tepi mengikuti lereng 1:2 dari kepala ke luar; notch = tumpuan talang
function canal(xh, notch) {
  const hw = P.bw / 2, T = P.wallT, top = x => Math.max(hAt(x), 0.2);
  for (const s of [-1, 1]) {
    const body = []; let nd = !notch;
    const putNotch = () => { body.push([notch[0], top(notch[0])], [notch[0], notch[2]], [notch[1], notch[2]], [notch[1], top(notch[1])]); nd = true; };
    for (const x of [P.a, P.xb0, P.xb1, P.xt]) { if (x <= xh + 1e-6) continue; if (!nd && x > notch[0]) putNotch(); body.push([x, top(x)]); }
    if (!nd) putNotch();
    const full = [[xh, P.bed - 0.2], [xh, top(xh)], ...body, [P.X, top(P.X)], [P.X, P.bed - 0.2]];
    for (const zs of [-1, 1]) { const poly = full.map(([x, y]) => [s * x, y]); if (s < 0) poly.reverse(); profileWall(poly, zs * hw, zs * (hw + T), MATS.wing); }

}
// gorong-gorong irigasi: barrel melintang jalan + kepala pada x = xh
function irrigCulvert(xh) {
  const hw = P.bw / 2 + P.wallT, hi = P.bIn / 2, yb0 = P.bed - P.bt, yTopIn = P.bed + P.hIn, yTop = yTopIn + P.bt, ho = hi + P.bt, ht = 0.3;
  box(-(xh - ht), xh - ht, yb0, P.bed, -ho, ho, MATS.culvert);
  box(-(xh - ht), xh - ht, P.bed, yTopIn, hi, ho, MATS.culvert); box(-(xh - ht), xh - ht, P.bed, yTopIn, -ho, -hi, MATS.culvert);
  box(-(xh - ht), xh - ht, yTopIn, yTop, -ho, ho, MATS.culvert);

  for (const s of [-1, 1]) {                     // kepala (dinding kepala) dengan bukaan barrel
    const yH = Math.max(hAt(xh), yTop + 0.1), x0 = s * (xh - ht), x1 = s * xh;
    box(x0, x1, yb0, P.bed, -hw, hw, MATS.conc);
    box(x0, x1, P.bed, yH, hi, hw, MATS.conc); box(x0, x1, P.bed, yH, -hw, -hi, MATS.conc);

const bothSides = f => { for (const s of [-1, 1]) f(s); };
const cutCanal = xh => (x, z) => (Math.abs(x) >= xh && Math.abs(z) <= P.bw / 2 + 1e-6) ? P.bed : null;

const BOX = RING.box;

// ---------- skenario
const TRAPS = [
  { n: 'Trapesium kecil · b 0,8 · H 0,9 · 1:0,5', b: 0.8, H: 0.9, zs: 0.5 },
  { n: 'Trapesium sedang · b 1,0 · H 1,2 · 1:0,5', b: 1.0, H: 1.2, zs: 0.5 },
  { n: 'Trapesium besar · b 1,0 · H 1,5 · 1:0,5', b: 1.0, H: 1.5, zs: 0.5 },
  { n: 'Saluran U / kotak (tanpa transisi)', box: true }];
const ST = { trap: 1 };
const trLen = r => Math.min(5, Math.max(2, 2.5 * (r.top - 1.0)));      // panjang transisi 2–5 m menurut lebar atas trapesium
const SCENES = {
  irig: { tab: 'Gorong-gorong irigasi · tanpa talang', build() {
    const xh = P.xb1; chanSeg(-P.Z, P.Z, BOX, BOX, MATS.ditch); earth(cutBoth(cutCanal(xh))); road(); canal(xh); irrigCulvert(xh); drawChannels();
    label('Badan jalan', 0, P.Hc + 0.3, -6); label('Timbunan lereng 1:2', 11, 2.1, -7); label('Saluran drainase (tertanam di timbunan, menerus)', P.xc, 2.2, -8.5, 'ditch');
    label('Kepala gorong-gorong', xh, 2.3, -2.5, 'conc'); label('Sayap / dinding penahan sejajar lereng 1:2', 17.2, 0.9, 2.5, 'conc'); label('Saluran irigasi terbuka', 21, 0.2, 0);
    label('Barrel gorong-gorong irigasi', 6, 0.9, 0, 'culvert'); },
    info: () => ({ title: 'Skenario 1 · gorong-gorong irigasi tanpa talang', sub: 'Berlaku di O5 (8+339,85), O7 (11+625,23), O8 (14+055,87): di Skenario 1 tidak ada talang.',

  talang: { tab: 'Talang (Skenario 1)', build() {

    label('Kepala gorong-gorong ditarik ke dalam', xh, 2.7, -2.5, 'conc'); label('Talang di luar kepala, di atas saluran irigasi', P.xc, 2.35, 0, 'talang'); label('Dinding penahan (tumpuan talang)', 12.0, 1.2, 2.6, 'conc');

    info: () => ({ title: 'Skenario 1 · talang di atas saluran irigasi', sub: 'Berlaku di O4 (6+283,89), O6 (9+942,90 s.d. 9+949,90), O9 (14+714,76 s.d. 14+729,00).',

  siphon: { tab: 'Siphon (Skenario 2)', build() {

    label('Siphon naik setelah saluran irigasi', P.xc, 1.2, hf + ramp / 2, 'siphon'); label('Saluran irigasi terbuka', 20.5, 0.2, 0); label('Kepala gorong-gorong', xh, 2.7, -2.5, 'conc'); },
    info: () => { const sel = TRAPS[ST.trap], R = sel.box ? null : RING.trap(sel.b, sel.H, sel.zs), L = sel.box ? 0 : trLen(R);
      return { title: 'Skenario 2 · siphon di bawah saluran irigasi', sub: 'Berlaku di O5 (8+339,85), O6 (9+942,90), O7 (11+625,23), O8 (14+064,93), O9 (14+714,76).', ctl: 'chSel',
      order: sel.box ? ['Saluran kotak tertanam di berm', 'Box siphon <b>turun</b> sebelum saluran irigasi', 'Mendatar di bawah dasar saluran irigasi', 'Box <b>naik</b> setelah saluran irigasi', 'Saluran kotak kembali'] :
        ['Saluran trapesium (tertanam di timbunan)', `<b>Transisi ${L.toFixed(1).replace('.', ',')} m</b> trapesium → kotak, dimulai 10 m sebelum siphon`, `Saluran kotak terbuka ${(10 - L).toFixed(1).replace('.', ',')} m`, 'Box siphon <b>turun</b> sebelum saluran irigasi (ramp pendek)', 'Mendatar di bawah dasar saluran irigasi (atap box 0,3 di bawahnya)', 'Naik setelah saluran irigasi, lalu urutan sama dibalik'],
      dims: [['Box siphon / saluran kotak (luar)', '1,0 × 1,0'], ['Dinding box', '0,25'], ['Kemiringan turun / naik', '1 : 1,5 (ramp 4,2)'], ['Siphon masuk dari tepi saluran', '6,4 sebelum as'], ['Atap box di bawah dasar saluran', '0,3'], ...(sel.box ? [] : [['Lebar atas trapesium (dalam)', R.top.toFixed(2).replace('.', ',')], ['Panjang transisi (2,5 × (lebar atas − 1,0), 2–5)', L.toFixed(2).replace('.', ',')], ['Awal transisi sebelum siphon', '10,0']])] }; } },
  cross: { tab: 'Gorong-gorong kawasan (cross drain)', build() {
    const inner = 0.5, wt = 0.15, ho = inner / 2 + wt, yIn = -0.3, yb0 = yIn - wt, yTop = yIn + inner + wt, xhead = P.xt - 0.75, xend = P.xt + 0.5;
    chanSeg(-P.Z, P.Z, BOX, BOX, MATS.ditch);
    earth(cutBoth((x, z) => (Math.abs(x) >= xhead && Math.abs(z) <= Math.min(1.65, ho + (Math.abs(x) - xhead) * 0.577)) ? yIn : null)); road(); drawChannels();
    box(-(xhead - 0.3), xhead - 0.3, yb0, yIn, -ho, ho, MATS.cross); box(-(xhead - 0.3), xhead - 0.3, yIn, yTop - wt, ho - wt, ho, MATS.cross); box(-(xhead - 0.3), xhead - 0.3, yIn, yTop - wt, -ho, -ho + wt, MATS.cross); box(-(xhead - 0.3), xhead - 0.3, yTop - wt, yTop, -ho, ho, MATS.cross);

        const xa = xhead + (xend - xhead) * n / N, xb = xhead + (xend - xhead) * (n + 1) / N;
        skewWall([s * xa, zs * (0.9 + (xa - xhead) * tan30)], [s * xb, zs * (0.9 + (xb - xhead) * tan30)], 0.2, yb0, topAt(xa), topAt(xb), MATS.wing);

      const mx = s * 2.4; box(mx - 0.55, mx + 0.55, yTop, P.Hc, -0.55, 0.55, MATS.conc); box(mx - 0.3, mx + 0.3, P.Hc, P.Hc + 0.06, -0.3, 0.3, MATS.iron);
    }
    label('Kepala gorong-gorong di kaki timbunan', xhead, 0.9, -1.4, 'conc'); label('Sayap 30° mengikuti lereng sampai timbunan selesai', xend, 0.5, 2.2, 'conc'); label('Box 0,5 × 0,5 melintang jalan', 8, 0.7, 0, 'cross'); label('Manhole (tutup besi cor)', 2.4, 2.8, 0.9, 'iron');
    label('Saluran drainase jalan tertanam di berm, tidak terganggu', P.xc, 2.2, -8, 'ditch'); label('Timbunan lereng 1:2', 11, 2.1, 7); },
    info: () => ({ title: 'Gorong-gorong kawasan · Skenario 1', sub: 'Tipikal TIPIKAL_GORONG_GORONG.dxf: box 0,5 × 0,5, beton f\'c 30 MPa, manhole besi cor di atas, kepala dengan sayap.',
      order: ['Sayap 30° terhadap sumbu gorong-gorong, <b>tinggi atasnya mengikuti lereng dan selesai setelah timbunan selesai</b>', 'Kepala gorong-gorong di kaki timbunan', 'Timbunan', 'Saluran drainase jalan tertanam di berm, di atas gorong-gorong dan tidak terpengaruh'],
      dims: [['Box (dalam)', '0,5 × 0,5'], ['Dinding box', '0,15'], ['Dasar dalam', '0,3 di bawah tanah'], ['Jarak antar manhole', '3,7 (tipikal)'], ['Sayap', '30°, selesai 0,5 setelah kaki timbunan'], ['Jarak atap box ke dasar saluran jalan', '≥ 1,3']] }) }
};

// ---------- UI
const tabs = document.getElementById('tabs'), info = document.getElementById('info'), labelsEl = document.getElementById('labels');
let cur = null, tagEls = [];
function show(k) {
  if (!SCENES[k]) k = 'irig'; cur = k;
  scene.remove(G); G.traverse(o => { if (o.geometry) o.geometry.dispose(); }); G = new THREE.Group(); scene.add(G); labels.length = 0; CH.length = 0;
  xray = (k === 'siphon' || k === 'cross'); SCENES[k].build(); applyXray();
  tagEls.forEach(e => e.remove()); tagEls = labels.map(l => { const e = document.createElement('div'); e.className = 'tg'; e.textContent = l.text; const c = l.hue && MATS[l.hue] ? '#' + MATS[l.hue].color.getHexString() : null; if (c) e.style.borderLeftColor = c; labelsEl.appendChild(e); return e; });
  [...tabs.children].forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const I = SCENES[k].info();
  info.innerHTML = `<h2>${I.title}</h2><p class="sub">${I.sub}</p><h3>Urutan dari luar ke arah jalan</h3><ol>${I.order.map(t => `<li>${t}</li>`).join('')}</ol><h3>Dimensi asumsi (m)</h3><table class="dim">${I.dims.map(d => `<tr><td>${d[0]}</td><td>${d[1]}</td></tr>`).join('')}</table>${I.ask ? `<div class="ask"><b>Perlu keputusan:</b> ${I.ask}</div>` : ''}`;
  if (I.ctl) { const w = document.createElement('div'); w.innerHTML = `<h3>Tipe saluran sebelum siphon</h3><select id="chSel">${TRAPS.map((t, n) => `<option value="${n}"${n === ST.trap ? ' selected' : ''}>${t.n}</option>`).join('')}</select>`; info.insertBefore(w, info.children[2]); w.querySelector('select').onchange = e => { ST.trap = +e.target.value; show('siphon'); }; }
  try { history.replaceState(null, '', '#' + k); } catch (e) {}
}
for (const k in SCENES) { const b = document.createElement('button'); b.textContent = SCENES[k].tab; b.dataset.k = k; b.onclick = () => show(k); tabs.appendChild(b); }
function applyXray() { MATS.earth.transparent = xray; MATS.earth.opacity = xray ? 0.16 : 1; MATS.earth.depthWrite = !xray; MATS.earth.needsUpdate = true; document.getElementById('bX').classList.toggle('on', xray); }
document.getElementById('bX').onclick = () => { xray = !xray; applyXray(); };
let showLbl = true; document.getElementById('bL').onclick = e => { showLbl = !showLbl; e.currentTarget.classList.toggle('on', showLbl); };
const CAMS = { iso: [[30, 13, -24], [13, 0.8, -2]], top: [[13, 52, 0.01], [13, 0, 0]], side: [[13, 3, -52], [13, 1, 0]] };
function setCam(k) { const [p, t] = CAMS[k]; cam.position.set(...p); ctl.target.set(...t); ctl.update(); }
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => setCam(b.dataset.cam));

function resize() { const r = cv.parentElement.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(cv.parentElement); resize();
const tmp = new THREE.Vector3();
function frame() {
  ctl.update(); renderer.render(scene, cam);
  const r = cv.getBoundingClientRect();
  labels.forEach((l, i) => { const e = tagEls[i]; if (!e) return; tmp.copy(l.v).project(cam); const vis = showLbl && tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05; e.style.display = vis ? '' : 'none'; if (vis) { e.style.left = (tmp.x * .5 + .5) * r.width + 'px'; e.style.top = (-tmp.y * .5 + .5) * r.height + 'px'; } });
  requestAnimationFrame(frame);
}
addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k in SCENES && k !== cur) show(k); });
setCam('iso'); show((location.hash || '').slice(1) in SCENES ? location.hash.slice(1) : 'irig'); frame();
</script>
