<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Section – Saluran Skenario 1 vs 2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%2338bdf8%27 stroke-width=%271.8%27%3E%3Cpath d=%27M3 8l9-5 9 5-9 5-9-5z%27/%3E%3Cpath d=%27M3 8v8l9 5 9-5V8%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8" stroke-dasharray="2 2"/></svg>
    <div><b>3D Section</b><span>Saluran &amp; Jalan · Skenario 1 vs 2</span></div>
  </div>
  <nav id="zones" aria-label="Zona saluran"></nav>
  <div class="hdr-right">
    <select id="goto" title="Lompat langsung ke bangunan pelengkap"><option value="">Lompat ke bangunan…</option></select>
    <select id="cutMode" title="Jenis potongan">
      <option value="sta">Potongan melintang (STA)</option>
      <option value="long">Potongan memanjang (offset)</option>
      <option value="level">Potongan datar (elevasi)</option>
      <option value="none">Tanpa potongan</option>
    </select>
    <button id="btnTags" class="on" title="Tampilkan / sembunyikan nama bangunan di 3D">🏷 Label</button>
    <button id="btnXray" title="Sembunyikan tanah / timbunan / sawah agar siphon dan pipa di bawah tanah terlihat">◌ Tembus tanah</button>
    <button id="btnFull" title="Layar penuh (F)">⛶ Layar penuh</button>
    <button id="btnLink" class="on" title="Kamera kedua jendela disinkronkan">⛓ Sinkron</button>
  </div>
</header>

<main id="stage">
  <canvas id="gl"></canvas>
  <div class="pane left"><div class="tag s1">SKENARIO 1</div><div class="card" id="cardL"></div></div>
  <div class="pane right"><div class="tag s2">SKENARIO 2</div><div class="card" id="cardR"></div></div>
  <div id="divider"></div>
  <div id="labels"><svg id="tagsvg"></svg></div>
  <div id="toast"></div>
</main>

<button id="btnPanel" class="panelbtn" title="Tampilkan / sembunyikan panel kontrol (H)" aria-expanded="true">▾</button>
<footer id="panel">
  <section class="timeline">
    <div class="tl-top">
      <div><span class="k">STA potongan</span> <b id="staLabel">–</b> <span id="segLabel" class="muted"></span></div>
      <div class="tl-btns">
        <button id="prev" title="Potongan sebelumnya (←)">◀</button>
        <button id="play" title="Putar (spasi)">▶</button>
        <button id="next" title="Potongan berikutnya (→)">▶</button>
      </div>
    </div>
    <div class="track" id="track"><div id="cover"></div><input id="sta" type="range" min="0" max="1000" step="0.01" value="0" aria-label="STA"></div>
    <div class="ticks" id="ticks"></div>
  </section>
  <section class="opts">
    <label title="Jarak tampil di depan bidang potong (kabut)">Jarak tampil <input id="win" type="range" min="20" max="400" step="5" value="150"><output id="winOut"></output></label>
    <label id="offWrap" hidden>Offset <input id="off" type="range" min="-30" max="30" step="0.1" value="0"><output id="offOut"></output></label>
    <label id="lvWrap" hidden>Elevasi <input id="lv" type="range" min="0" max="100" step="0.05" value="0"><output id="lvOut"></output></label>
    <label>Eksagerasi vertikal <input id="ve" type="range" min="1" max="4" step="0.5" value="1"><output id="veOut"></output></label>
    <label class="chk"><input type="checkbox" id="flip"> Balik sisi potong</label>
    <div class="views">
      <button data-v="sect">Tampak potongan</button><button data-v="iso">Isometrik</button><button data-v="side">Samping</button><button data-v="top">Atas</button>
    </div>
  </section>
  <section class="legend" id="legend"></section>
</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
